# Local-dev stack for kokedb — PostgreSQL + the kokedb MySQL server, both
# containerized.
#
#   make up      # build (if needed) + start the whole stack in background
#   make ps      # status / health
#   make mysql   # mysql client against the server (host 127.0.0.1:3306)
#   make down    # stop + remove containers (keeps volumes)
#   make reset   # stop + wipe volumes AND local cache dirs (fresh state)
#
# postgres is reachable on the host at 127.0.0.1:25432 (for host-side tests);
# the server reaches it in-network as host `postgres:5432`.

name: kokedb

services:
  postgres:
    image: postgres:17.6
    container_name: kokedb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # host:container — override the host port with PG_PORT if 25432 is taken.
      - "${PG_PORT:-25432}:5432"
    volumes:
      - kokedb-pgdata:/var/lib/postgresql/data
      # First-init scripts: create the `kokedb` meta DB + seed test fixtures.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kokedb-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: kokedb-server:local
    container_name: kokedb-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # In-network DSN to the meta `kokedb` database (service name `postgres`).
      PG_META_DSN: postgresql://postgres:123456@postgres:5432/kokedb
      RESULT_CACHE_DIR: /data/cache
      RUST_LOG: ${RUST_LOG:-info}
      # Authentication & multi-tenancy: accounts live in `system.app_user` and
      # apply to BOTH the MySQL and PostgreSQL front-ends. Setting both vars below
      # seeds a superuser on startup; once any user exists, auth is enforced.
      # Leave them empty for open access (no auth). Scope other users to specific
      # catalogs via the `allowed_catalogs` column.
      KOKEDB_ADMIN_USER: ${KOKEDB_ADMIN_USER:-}
      KOKEDB_ADMIN_PASSWORD: ${KOKEDB_ADMIN_PASSWORD:-}
      # Prometheus metrics endpoint (in-container address).
      KOKEDB_METRICS_ADDR: 0.0.0.0:9090
    ports:
      # host:container — override the host port with MYSQL_PORT if 3306 is taken.
      - "${MYSQL_PORT:-3306}:3306"
      # Prometheus metrics — scrape http://127.0.0.1:${METRICS_PORT}/metrics
      - "${METRICS_PORT:-9090}:9090"
    volumes:
      - kokedb-cache:/data/cache
    healthcheck:
      # python is in the runtime image; use it to TCP-probe the MySQL port.
      test:
        - CMD-SHELL
        - "python3 -c \"import socket; socket.create_connection(('127.0.0.1',3306),2)\" || exit 1"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  kokedb-pgdata:
  kokedb-cache:
